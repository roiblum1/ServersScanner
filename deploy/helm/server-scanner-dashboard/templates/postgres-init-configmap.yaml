{{- if and .Values.postgres.enabled .Values.postgres.initScript }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server-scanner-dashboard.fullname" . }}-postgres-init
  labels:
    {{- include "server-scanner-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
data:
  init.sql: |
    -- Create server_maintenance table
    CREATE TABLE IF NOT EXISTS server_maintenance (
        server_name VARCHAR(255) PRIMARY KEY,
        reason TEXT NOT NULL,
        severity VARCHAR(20) NOT NULL CHECK (severity IN ('critical', 'high', 'medium', 'low')),
        timestamp TIMESTAMP WITH TIME ZONE NOT NULL,
        created_by VARCHAR(255),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create index on severity for faster filtering
    CREATE INDEX IF NOT EXISTS idx_server_maintenance_severity ON server_maintenance(severity);

    -- Create index on timestamp for time-based queries
    CREATE INDEX IF NOT EXISTS idx_server_maintenance_timestamp ON server_maintenance(timestamp);

    -- Grant permissions to application user
    GRANT SELECT, INSERT, UPDATE, DELETE ON server_maintenance TO {{ .Values.postgres.auth.username }};
{{- end }}
