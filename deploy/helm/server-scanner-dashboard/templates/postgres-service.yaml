{{- if .Values.postgres.enabled }}
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ include "server-scanner-dashboard.fullname" . }}-postgres-headless
  labels:
    {{- include "server-scanner-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  selector:
    {{- include "server-scanner-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
# Regular service for application access
apiVersion: v1
kind: Service
metadata:
  name: {{ include "server-scanner-dashboard.fullname" . }}-postgres
  labels:
    {{- include "server-scanner-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  selector:
    {{- include "server-scanner-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
{{- end }}
