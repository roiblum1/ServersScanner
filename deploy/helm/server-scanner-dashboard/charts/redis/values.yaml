# Redis subchart configuration
# This chart is deployed as part of server-scanner-dashboard

# Redis image configuration
image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 6379

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""  # Use default storage class
  accessMode: ReadWriteOnce
  size: 8Gi
  annotations: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 999  # redis user
  fsGroup: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Health check configuration
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Redis configuration
config:
  # Enable AOF persistence
  appendonly: "yes"
  # AOF sync frequency
  appendfsync: "everysec"
  # Max memory policy (evict old data when limit reached)
  maxmemory-policy: "allkeys-lru"
  # Max memory (empty = no limit)
  maxmemory: ""
